function toast(mensaje, tipo = 'success', duracion = 3500) {
    const iconos = { success: 'check_circle', error: 'error', warning: 'warning' };
    const div = document.createElement('div');
    div.className = `toast-msg ${tipo}`;
    div.innerHTML = `<span class="material-symbols-outlined" style="font-size:18px;">${iconos[tipo]}</span>${mensaje}`;

    container.appendChild(div);
    setTimeout(() => div.remove(), duracion);
}

  function sesionLocalVigente() {

    const sesionActiva =
        localStorage.getItem('sesionActiva') === '1';

    if (!sesionActiva) {
        return false;
    }

    return ultimaValidacionVigente();
}
  
function normalizar(texto) {
    return (texto || '').toString().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');
}
  async function generarHash(data) {
    const texto = JSON.stringify(data);

    const encoder = new TextEncoder();
    const bytes = encoder.encode(texto);

    const hashBuffer = await crypto.subtle.digest(
        'SHA-256',
        bytes
    );

    return Array.from(
        new Uint8Array(hashBuffer)
    )
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}
function tokenVigente() {

async function guardarNuevoExpedienteLocal(expediente) {

    const db = await initDB();

    return new Promise((resolve, reject) => {

        const tx = db.transaction(
            ['expedientes'],
            'readwrite'
        );    

        const store = tx.objectStore('expedientes');

// Verifica si existe una sesión local aún vigente
function sesionLocalVigente() {

    const sesionActiva =
        localStorage.getItem('sesionActiva') === '1';

    const tokenExpira =
        parseInt(
            localStorage.getItem('tokenExpira') || '0',
            10
        );

    if (!sesionActiva) {
        return false;
    }

    if (!tokenExpira) {
        return false;
    }

    return Date.now() < tokenExpira;
}

window.iniciarSesion = async () => {

    try {

        // Verificar que la librería de Google esté cargada
        if (
            typeof google === 'undefined' ||
            !google.accounts ||
            !google.accounts.oauth2
        ) {
            toast(
                'Cargando servicio de autenticación. Intenta nuevamente en unos segundos.',
                'warning',
                5000
            );
            return;
        }

       

        // Validar nuevamente
        if (!App.tokenClient) {
            toast(
                'No se pudo inicializar el inicio de sesión.',
                'error',
                6000
            );
            return;
        }

        // IMPORTANTE:
        // Siempre abrir el popup de Google cuando el usuario
        // haga clic explícitamente en el botón.
        App.tokenClient.requestAccessToken({
            prompt: 'select_account'
        });

    } catch (e) {

        console.error(
            'Error en iniciarSesion:',
            e
        );

        toast(
            'No se pudo iniciar sesión.',
            'error',
            6000
        );
    }
};
window.cerrarSesion = () => {

    // Revocar token actual
    if (
        App.accessToken &&
        typeof google !== 'undefined' &&
        google.accounts &&
        google.accounts.oauth2
    ) {
        google.accounts.oauth2.revoke(
            App.accessToken,
            () => {}
        );
    }

    // Limpiar timer
    if (App.timerRenovacion) {
        clearInterval(App.timerRenovacion);
        App.timerRenovacion = null;
    }

    // Limpiar almacenamiento local
    localStorage.removeItem('sesionActiva');
    localStorage.removeItem('ultimaValidacion');
    localStorage.removeItem('tokenExpira');

    // Limpiar memoria
    App.accessToken = null;
    App.tokenExpira = 0;
    App.tokenClient = null;

    // Recargar aplicación
    location.reload();
};
async function entrarApp() {

    // Mostrar inmediatamente la aplicación
    document.getElementById('splash-screen').style.display = 'none';
    document.getElementById('search-bar').style.display = 'block';
    document.getElementById('btn-logout-nav').style.display = 'flex';

    // Si no hay internet, usar datos locales
    if (!navigator.onLine) {
        await consultarDatos();
        return;
    }

    // Si ya existe token en memoria, consultar directamente
    if (App.accessToken) {
        await consultarDatos();
        return;
    }

    // Si la sesión sigue vigente, intentar recuperar token silenciosamente
    if (tokenVigente() && App.tokenClient) {
        try {
            App.tokenClient.requestAccessToken({
                prompt: ''
            });
            return; // El callback del token llamará nuevamente a entrarApp()
        } catch (e) {
            console.error('No se pudo renovar el token:', e);
        }
    }

    // Si no fue posible renovar, cargar al menos datos locales
    await consultarDatos();
}

async function consultarDatos() {

  // SIN INTERNET
if (!navigator.onLine) {

    toast(
        'Modo offline activo',
        'warning'
    );

    const datosLocales =
        await cargarExpedientesLocal();

    if (datosLocales.length > 0) {

        App.rawData = [COLUMNAS, ...datosLocales];

        prepararFiltros();

        App.paginaActual = 1;

        App.filtrados = App.rawData.slice(1);

        window.aplicarFiltroFinal();

        return;
    }

    toast(
        'No existen datos guardados localmente.',
        'error'
    );

    return;
}

// SIN TOKEN EN MEMORIA
if (!App.accessToken) {

    // Si existe una sesión válida, cargar datos locales mientras se renueva el token
    if (tokenVigente() || ultimaValidacionVigente()) {

        const datosLocales = await cargarExpedientesLocal();

        if (datosLocales.length > 0) {
            App.rawData = [COLUMNAS, ...datosLocales];
            prepararFiltros();
            App.paginaActual = 1;
            App.filtrados = App.rawData.slice(1);
            window.aplicarFiltroFinal();
        }

        return;
    }

    toast('Sesión expirada. Ingresa de nuevo.', 'warning');
    window.cerrarSesion();
    return;
}
    
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/DB!A:Z`;
    try {
        const response = await fetch(url, {
            headers: { 'Authorization': 'Bearer ' + App.accessToken }
        });

        if (response.status === 401) {
            toast('Sesión expirada. Vuelve a ingresar.', 'warning');
            window.cerrarSesion();
            return;
        }
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        if (data.values && data.values.length > 1) {
            App.rawData = data.values;
            await guardarExpedientesLocal(data.values);
            prepararFiltros();
            App.paginaActual = 1;
            App.filtrados = App.rawData.slice(1);
            window.aplicarFiltroFinal();
        } else if (data.values && data.values.length <= 1) {
            toast('La hoja de datos está vacía.', 'warning');
        } else {
            throw new Error(data.error?.message || 'Respuesta inesperada de la API');
        }
    } catch (e) {
        console.error('consultarDatos:', e);
        toast('No se pudieron cargar los expedientes. ' + (e.message || ''), 'error');
    }
}

function parseFecha(fechaStr) {

    if (!fechaStr || typeof fechaStr !== 'string') {
        return 0;
    }

    fechaStr = fechaStr
        .trim()
        .toLowerCase()
        .replace(',', '')
        .replace('a. m.', 'am')
        .replace('p. m.', 'pm')
        .replace('a.m.', 'am')
        .replace('p.m.', 'pm');

    const match = fechaStr.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?)?$/
    );

    if (!match) {
        return 0;
    }

    let dia       = parseInt(match[1], 10);
    let mes       = parseInt(match[2], 10) - 1;
    let anio      = parseInt(match[3], 10);
    let horas     = parseInt(match[4] || 0, 10);
    let minutos   = parseInt(match[5] || 0, 10);
    let segundos  = parseInt(match[6] || 0, 10);
    let periodo   = match[7] || '';

    // Conversión AM/PM
    if (periodo === 'pm' && horas < 12) {
        horas += 12;
    }

    if (periodo === 'am' && horas === 12) {
        horas = 0;
    }

    return new Date(
        anio,
        mes,
        dia,
        horas,
        minutos,
        segundos
    ).getTime();
}

function renderPaginacion(totalPaginas, actual) {
    const bar = document.getElementById('pagination-bar');
    bar.innerHTML = '';
    if (totalPaginas <= 1) return;

    const ir = (n) => { App.paginaActual = n; renderCards(App.filtrados); window.scrollTo({ top: 0, behavior: 'smooth' }); };

    // Anterior
    const prev = document.createElement('button');
    prev.textContent = '‹ Anterior';
    prev.disabled = actual === 1;
    prev.onclick = () => ir(actual - 1);
    bar.appendChild(prev);

    // Números de página (máx 5 visibles)
    const rango = paginasVisibles(actual, totalPaginas);
    rango.forEach(n => {
        if (n === '…') {
            const span = document.createElement('span');
            span.textContent = '…';
            bar.appendChild(span);
        } else {
            const btn = document.createElement('button');
            btn.textContent = n;
            if (n === actual) btn.classList.add('active');
            btn.onclick = () => ir(n);
            bar.appendChild(btn);
        }
    });

    // Siguiente
    const next = document.createElement('button');
    next.textContent = 'Siguiente ›';
    next.disabled = actual === totalPaginas;
    next.onclick = () => ir(actual + 1);
    bar.appendChild(next);
}

function paginasVisibles(actual, total) {
    if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
    const paginas = [1];
    if (actual > 3) paginas.push('…');
    for (let i = Math.max(2, actual - 1); i <= Math.min(total - 1, actual + 1); i++) paginas.push(i);
    if (actual < total - 2) paginas.push('…');
    paginas.push(total);
    return paginas;
}

window.guardarCambios = async function () {

    // ==========================================================
    // CONTROL DEL BOTÓN GUARDAR (spinner + disabled)
    // ==========================================================
    const btnGuardar = document.getElementById('btn-guardar');
    const btnTexto   = document.getElementById('btn-guardar-txt');
    const btnSpinner = document.getElementById('btn-guardar-spin');

    const restaurarBoton = () => {
        btnGuardar.disabled = false;
        btnTexto.textContent = 'Guardar';
        btnSpinner.style.display = 'none';
    };

    btnGuardar.disabled = true;
    btnTexto.textContent = 'Guardando...';
    btnSpinner.style.display = 'inline-block';

    try {

        // ======================================================
        // VALIDACIÓN DE SESIÓN
        // ======================================================
        if (!navigator.onLine && !App.accessToken) {
            // Offline sin token: permitido
        } else if (navigator.onLine && !App.accessToken) {
            toast('Sesión expirada.', 'warning');
            restaurarBoton();
            return;
        }

        // ======================================================
        // DATOS BÁSICOS
        // ======================================================
        const rowIndex = document.getElementById('edit-row-index').value;

        const tipoRevision =
            document.getElementById('tipo-revision').value;

        if (!tipoRevision) {
            toast('Debes seleccionar FÍSICO o DIGITAL.', 'warning');
            restaurarBoton();
            return;
        }

        const completo =
            document.getElementById('toggle-edicion').checked;

        const ahora = new Date();

        const fecha =
            String(ahora.getDate()).padStart(2, '0') + '/' +
            String(ahora.getMonth() + 1).padStart(2, '0') + '/' +
            ahora.getFullYear() + ' ' +
            String(ahora.getHours()).padStart(2, '0') + ':' +
            String(ahora.getMinutes()).padStart(2, '0') + ':' +
            String(ahora.getSeconds()).padStart(2, '0');

        const filaOriginal =
            App.rawData[rowIndex - 1];

        const filaNueva =
            [...filaOriginal];

        const updates = [];

        function pushUpdate(col, value) {
            const index = col.charCodeAt(0) - 65;
            filaNueva[index] = value;
            updates.push({
                col,
                value
            });
        }

        // ======================================================
        // CAPTURA DE CAMBIOS
        // ======================================================
        if (!completo) {

            pushUpdate('Y', document.getElementById('edit-nota').value);
            pushUpdate('W', document.getElementById('edit-ubicacion').value);
            pushUpdate('L', document.getElementById('edit-estado').value);
            pushUpdate('U', document.getElementById('edit-termino').value);
            pushUpdate('T', document.getElementById('edit-pendientes').value);
            pushUpdate('S', document.getElementById('edit-observaciones').value);

        } else {

            document.querySelectorAll('.campo-completo')
                .forEach(el => {

                    const index = parseInt(el.dataset.index, 10);
                    const letra =
                        String.fromCharCode(65 + index);

                    pushUpdate(letra, el.value);
                });
        }

        // Fecha de modificación
        pushUpdate('V', fecha);

        // Tipo de revisión
        pushUpdate('X', tipoRevision);

        // ======================================================
        // DETERMINAR CAMBIOS REALES
        // ======================================================
        const cambiosReales = updates.filter(u => {
            const index = u.col.charCodeAt(0) - 65;
            const anterior = filaOriginal[index] || '';
            const nuevo = u.value || '';
            return anterior !== nuevo;
        });

        if (!cambiosReales.length) {
            toast('No se detectaron cambios.', 'warning');
            restaurarBoton();
            return;
        }

        // ======================================================
        // LOG ÚNICO POR EVENTO
        // ======================================================
        const camposModificados = cambiosReales.map(u => {
            const index = u.col.charCodeAt(0) - 65;
            return COLUMNAS[index];
        });

        const logBase = {
            expediente: filaNueva[1],
            campos: camposModificados,
            totalCampos: camposModificados.length,
            fecha,
            modo: navigator.onLine ? 'ONLINE' : 'OFFLINE'
        };

        const hash = await generarHash(logBase);

        const log = {
            logId: crypto.randomUUID(),
            fecha,
            usuario:
                localStorage.getItem('usuario') ||
                'desconocido',
            deviceId: DEVICE_ID,
            expedienteId: filaNueva[0],
            campo: `UPDATE (${camposModificados.length} campos)`,
            valorAnterior: '',
            valorNuevo: camposModificados.join(', '),
            versionAnterior: filaOriginal[21] || '',
            versionNueva: fecha,
            modo:
                navigator.onLine
                    ? 'ONLINE'
                    : 'OFFLINE',
            estado:
                navigator.onLine
                    ? 'SYNCED'
                    : 'PENDING',
            hash
        };

        // ======================================================
        // GUARDAR LOCAL SIEMPRE
        // ======================================================
        await actualizarExpedienteLocal(
            parseInt(filaNueva[0], 10),
            filaNueva
        );

        // Actualizar memoria
        App.rawData[rowIndex - 1] = filaNueva;

        // ======================================================
        // MODO OFFLINE
        // ======================================================
        if (!navigator.onLine) {

            await agregarCambioQueue({
                rowIndex,
                expedienteId: filaNueva[0],
                fila: filaNueva,
                updates: cambiosReales,
                fecha
            });

            // Registrar un solo log
            await registrarLog(log);

            // Programar exportación (15 min sin cambios)
            if (typeof programarExportacionPendientes === 'function') {
                programarExportacionPendientes();
            }

            toast(
                'Guardado offline. Pendiente de sincronización.',
                'warning',
                5000
            );

        } else {

            // ==================================================
            // MODO ONLINE
            // ==================================================
            const requests = [];
            for (const u of cambiosReales) {

    const response = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/DB!${u.col}${rowIndex}?valueInputOption=USER_ENTERED`,
        {
            method: 'PUT',
            headers: {
                'Authorization': 'Bearer ' + App.accessToken,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                values: [[u.value]]
            })
        }
    );

    if (response.status === 429) {
        await new Promise(r => setTimeout(r, 1000));

        const retry = await fetch(
            `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/DB!${u.col}${rowIndex}?valueInputOption=USER_ENTERED`,
            {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + App.accessToken,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    values: [[u.value]]
                })
            }
        );

        if (!retry.ok) {
            throw new Error(`Error Google Sheets ${retry.status}`);
        }
    }
    else if (!response.ok) {
        throw new Error(`Error Google Sheets ${response.status}`);
    }
}
          

            const responses =
                await Promise.all(requests);

            for (const response of responses) {
                if (!response.ok) {
                    throw new Error(
                        `Error Google Sheets: ${response.status}`
                    );
                }
            }

            // Registrar un solo log
            await registrarLog(log);

            // Subir un solo log
            await subirLogSheets(log);

            toast(
                'Expediente actualizado.',
                'success'
            );
        }

        // ======================================================
        // CERRAR MODAL
        // ======================================================
        modalEdit.hide();

        // ======================================================
        // RECONSTRUIR FILTROS Y REORDENAR
        // (mueve la card al inicio o final según el orden)
        // ======================================================
        window.aplicarFiltroFinal();

    } catch (e) {

        console.error(e);

        toast(
            'No se pudo guardar: ' + (e.message || ''),
            'error',
            7000
        );

    } finally {

        restaurarBoton();
    }
};

<script>
  // ═══════════════════════════════════════
// EXPORTACIÓN DIFERIDA DE PENDIENTES
// ═══════════════════════════════════════

let timerExportacionPendientes = null;

// Programa la exportación 15 minutos después del último cambio offline
function programarExportacionPendientes() {

    if (timerExportacionPendientes) {
        clearTimeout(timerExportacionPendientes);
    }

    timerExportacionPendientes = setTimeout(async () => {
        try {
            if (typeof exportarPendientes === 'function') {
                await exportarPendientes();
                console.log('Pendientes exportados automáticamente.');
            }
        } catch (e) {
            console.error('Error al exportar pendientes:', e);
        }
    }, 15 * 60 * 1000); // 15 minutos
}

// Exportar al cerrar la app
async function exportarPendientesAlCerrar() {
    try {
        if (typeof exportarPendientes === 'function') {
            await exportarPendientes();
        }
    } catch (e) {
        console.error('Error al exportar pendientes al cerrar:', e);
    }
}
// Exportación automática desactivada temporalmente.
// Se reactivará en db.js con una estrategia segura.
// pagehide es más confiable en iOS y PWA
// window.addEventListener('pagehide', exportarPendientesAlCerrar);
// Respaldo adicional
//window.addEventListener('beforeunload', exportarPendientesAlCerrar);
// ═══════════════════════════════════════
// ONLINE / OFFLINE
// ═══════════════════════════════════════

window.addEventListener('online', () => {

    toast(
        'Conexión restaurada',
        'success'
    );

    sincronizarPendientes();

// LOGS

async function subirLogSheets(log) {

    if (!navigator.onLine) {
        return;
    }

    try {

        await fetch(
            `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${LOG_SHEET}!A:M:append?valueInputOption=USER_ENTERED`,
            {
                method: 'POST',

                headers: {

                    Authorization:
                        'Bearer ' + App.accessToken,

                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify({

                    values: [[

                        log.logId,

                        log.fecha,

                        log.usuario,

                        log.deviceId,

                        log.expedienteId,

                        log.campo,

                        log.valorAnterior,

                        log.valorNuevo,

                        log.versionAnterior,

                        log.versionNueva,

                        log.modo,

                        log.estado,

                        log.hash
                    ]]
                })
            }
        );

    } catch (e) {

        console.error(
            'Error LOG',
            e
        );
    }
}

// ═══════════════════════════════════════
// SYNC PLACEHOLDER
// ═══════════════════════════════════════

let sincronizando = false;

async function sincronizarPendientes() {

    // Evitar ejecuciones simultáneas
    if (sincronizando) {
        return;
    }

    // Sin internet
    if (!navigator.onLine) {
        return;
    }

    // ─────────────────────────────────────────────
    // ASEGURAR TOKEN VÁLIDO ANTES DE SINCRONIZAR
    // ─────────────────────────────────────────────
    if (!App.accessToken) {

        // Si la sesión ya expiró, no intentar sincronizar
        if (!ultimaValidacionVigente()) {
            toast(
                'La sesión expiró. Inicia sesión para sincronizar.',
                'warning',
                6000
            );
            return;
        }

        // Solicitar token silenciosamente
        try {
            await new Promise((resolve, reject) => {

                // Respaldar callback original
                const callbackOriginal =
                    App.tokenClient.callback;

                // Callback temporal
                App.tokenClient.callback =
                    (tokenResponse) => {

                        // Restaurar callback original
                        App.tokenClient.callback =
                            callbackOriginal;

                        if (
                            tokenResponse &&
                            tokenResponse.access_token
                        ) {
                            // Guardar token en memoria
                            App.accessToken =
                                tokenResponse.access_token;

                            // Renovar expiración (8 horas)
                            App.tokenExpira =
                                Date.now() +
                                (8 * 60 * 60 * 1000);

                            // Persistir metadatos
                            localStorage.setItem(
                                'tokenExpira',
                                App.tokenExpira.toString()
                            );

                            localStorage.setItem(
                                'ultimaValidacion',
                                Date.now().toString()
                            );

                            resolve();
                        } else {
                            reject(
                                new Error(
                                    'No se obtuvo token'
                                )
                            );
                        }
                    };

                // Solicitud silenciosa
                App.tokenClient.requestAccessToken({
                    prompt: ''
                });
            });

        } catch (e) {

            console.error(
                'No fue posible renovar el token:',
                e
            );

            toast(
                'No fue posible sincronizar. Inicia sesión nuevamente.',
                'warning',
                6000
            );

            return;
        }
    }

    // Marcar proceso activo
    sincronizando = true;

    try {

        const pendientes =
            await obtenerQueuePendiente();

        if (!pendientes.length) {
            return;
        }

        toast(
            `Sincronizando ${pendientes.length} cambios...`,
            'warning',
            4000
        );

        for (const item of pendientes) {
          
if (item.type === 'nuevo_expediente') {

    await guardarNuevoExpedienteRemoto(
        item.expediente
    );

    await eliminarQueueItem(
        item.queueId
    );

    continue;
}
            try {

                const requests = [];

                item.updates.forEach(u => {
                    requests.push(
                        fetch(
                            `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/DB!${u.col}${item.rowIndex}?valueInputOption=USER_ENTERED`,
                            {
                                method: 'PUT',
                                headers: {
                                    Authorization:
                                        'Bearer ' + App.accessToken,
                                    'Content-Type':
                                        'application/json'
                                },
                                body: JSON.stringify({
                                    values: [[u.value]]
                                })
                            }
                        )
                    );
                });

                const responses =
                    await Promise.all(requests);

                // Verificar respuestas
                for (const response of responses) {

                    if (response.status === 401) {
                        console.warn(
                            'Token expirado. Sincronización detenida.'
                        );

                        // Limpiar token en memoria
                        App.accessToken = null;
                        App.tokenExpira = 0;

                        localStorage.removeItem(
                            'tokenExpira'
                        );

                        toast(
                            'Sesión expirada. Inicia sesión nuevamente.',
                            'warning',
                            6000
                        );

                        return;
                    }

                    if (!response.ok) {
                        throw new Error(
                            `HTTP ${response.status}`
                        );
                    }
                }

                // Eliminar de la queue
                await eliminarQueueItem(
                    item.queueId
                );

            } catch (e) {

                console.error(
                    'Error sincronizando item:',
                    e
                );

                // Mantener el item en la queue
                // para reintentar más tarde
                break;
            }
        }

        toast(
            'Sincronización finalizada',
            'success'
        );

    } catch (e) {

        console.error(
            'Error general de sincronización:',
            e
        );

    } finally {

        sincronizando = false;
    }
}

           // Los cambios offline siempre sobrescriben la versión online.
           // La detección de conflictos se reimplementará posteriormente
           // utilizando versionAnterior almacenada en la queue.
